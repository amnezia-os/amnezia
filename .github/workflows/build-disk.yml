---
name: Build disk images

on:
  workflow_dispatch:
    inputs:
      upload-to-sourceforge:
        description: "Upload disk images to SourceForge"
        required: false
        default: false
        type: boolean
      publish-release:
        description: "Publish disk images as a GitHub release (splits files over 2 GiB)"
        required: false
        default: false
        type: boolean
      platform:
        required: true
        type: choice
        options:
          - amd64
          - arm64
  # Only run for changes that can actually change the disk images. In
  # particular do not list this file: an action bump by Dependabot would
  # otherwise kick off a full, hour long disk build.
  pull_request:
    branches:
      - main
    paths:
      - 'disk_config/disk.toml'
      - 'disk_config/iso.toml'

env:
  IMAGE_NAME: ${{ github.event.repository.name }} # output of build.yml, keep in sync
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"  # do not edit
  DEFAULT_TAG: "latest"
  BIB_IMAGE: "quay.io/centos-bootc/bootc-image-builder:latest"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Build disk images
    # `inputs.platform` is empty when the workflow is triggered by a pull
    # request, and Amnezia OS only ships amd64 images, so default to amd64.
    # ubuntu-26.04 runs the job with mount restrictions that make osbuild fail
    # with "mount: /run/osbuild/tree/dev: permission denied"; 24.04 is LTS and
    # is what bootc-image-builder is normally exercised on.
    runs-on: ${{ inputs.platform == 'arm64' && 'ubuntu-26.04-arm' || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        disk-type: ["qcow2", "anaconda-iso"]
    permissions:
      contents: write   # needed to create the GitHub release
      packages: read
      id-token: write

    steps:
      - name: Prepare environment
        run: |
          USER_UID=$(id -u)
          USER_GID=$(id -g)
          # Concatenate the types with a hyphen
          DISK_TYPE=$(echo "${{ matrix.disk-type }}" | tr ' ' '-')
          # Lowercase the image uri
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_ENV}
          echo "DISK_TYPE=${DISK_TYPE}" >> ${GITHUB_ENV}
          echo "USER_UID=${USER_UID}" >> ${GITHUB_ENV}
          echo "USER_GID=${USER_GID}" >> ${GITHUB_ENV}

      - name: Install dependencies
        if: inputs.platform == 'arm64'
        run: |
          set -x
          sudo apt update -y
          sudo apt install -y \
            podman

      - name: Maximize build space
        if: inputs.platform != 'arm64'
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build disk images
        id: build
        uses: osbuild/bootc-image-builder-action@8661cd3832544ad68c12dcde8681b13ab0f56a8d # main
        with:
          builder-image: ${{ env.BIB_IMAGE }}
          config-file: ${{ matrix.disk-type == 'anaconda-iso' && './disk_config/iso.toml' || './disk_config/disk.toml' }}
          image: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.DEFAULT_TAG }}
          chown: ${{ env.USER_UID }}:${{ env.USER_GID }}
          types: ${{ matrix.disk-type }}
          # The image declares ext4 as its default root filesystem
          # (/usr/lib/bootc/install/00-amnezia.toml); the flag is belt and
          # braces so the build does not depend on that file being present.
          additional-args: --use-librepo=True --rootfs ext4

      - name: Upload disk images and Checksum to Job Artifacts
        if: inputs.upload-to-sourceforge != true && inputs.publish-release != true && github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: amnezia-${{ matrix.disk-type }}
          path: ${{ steps.build.outputs.output-directory }}
          if-no-files-found: error
          retention-days: 0
          compression-level: 0
          overwrite: true
      
      # GitHub caps a release asset at 2 GiB, so bigger images are published as
      # <name>.part00, <name>.part01, ... next to download.sh, which reassembles
      # them and verifies the checksums. Needs no account, phone or card from
      # whoever downloads them.
      - name: Publish to GitHub Releases
        if: inputs.publish-release == true && github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_DIR: ${{ steps.build.outputs.output-directory }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          TAG="disks-$(date -u +%Y%m%d)-${GITHUB_RUN_NUMBER}"

          STAGE="$(mktemp -d)"
          trap 'rm -rf "${STAGE}"' EXIT

          # bootc-image-builder nests its output, so collect the images flat.
          find "${SOURCE_DIR}" -type f \( -name '*.iso' -o -name '*.qcow2' \) \
            -exec cp --sparse=always -v {} "${STAGE}/" \;
          cp disk_config/download.sh "${STAGE}/download.sh"

          # One checksum file per image: the two matrix jobs upload into the
          # same release, so a single shared SHA256SUMS would be overwritten by
          # whichever job finishes last.
          ( cd "${STAGE}" && for f in *.iso *.qcow2; do
              sha256sum -- "$f" > "$f.sha256"
            done )

          limit=$((2000 * 1024 * 1024))
          for f in "${STAGE}"/*.iso "${STAGE}"/*.qcow2; do
            if (( $(stat -c%s "$f") > limit )); then
              echo "==> $(basename "$f") is over 2 GiB, splitting"
              split -b 1900M -d -a 2 "$f" "${f}.part"
              rm -f "$f"
            fi
          done

          # One job per disk type publishes into the same release; whichever
          # gets there first writes the notes, the other just adds its assets.
          gh release create "${TAG}" \
            --title "Amnezia OS disk images $(date -u +%Y-%m-%d)" \
            --notes-file disk_config/release-notes.md \
            || echo "release ${TAG} already created by the other job"

          gh release upload "${TAG}" "${STAGE}"/* --clobber

          # Release assets are not unlimited: keep this build and the previous
          # one, drop everything older.
          gh release list --limit 100 --json tagName --jq '.[].tagName' \
            | { grep '^disks-' || true; } \
            | { grep -vx "${TAG}" || true; } \
            | tail -n +2 \
            | while read -r old; do
                echo "==> deleting old release ${old}"
                gh release delete "${old}" --yes --cleanup-tag
              done

      # SourceForge's File Release System takes uploads over rsync/SSH and then
      # mirrors them worldwide. Same command the docs recommend for anything
      # over 100 MB, since it resumes interrupted transfers. Kept as an
      # alternative for when a SourceForge account is available (their sign-up
      # phone verification does not cover every country).
      - name: Upload to SourceForge
        if: inputs.upload-to-sourceforge == true && github.event_name != 'pull_request'
        shell: bash
        env:
          SF_USERNAME: ${{ secrets.SF_USERNAME }}
          SF_PROJECT: ${{ secrets.SF_PROJECT }}
          SF_SSH_KEY: ${{ secrets.SF_SSH_KEY }}
          SOURCE_DIR: ${{ steps.build.outputs.output-directory }}
        run: |
          set -euo pipefail

          install -m 700 -d ~/.ssh
          printf '%s\n' "${SF_SSH_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519,rsa frs.sourceforge.net >> ~/.ssh/known_hosts 2>/dev/null
          chmod 600 ~/.ssh/known_hosts

          REMOTE="/home/frs/project/${SF_PROJECT}/amnezia"
          ssh "${SF_USERNAME}@frs.sourceforge.net" "mkdir -p ${REMOTE}"

          # bootc-image-builder nests its output (e.g. output/bootiso/...), so
          # collect the images flat: one predictable file name per build.
          STAGE="$(mktemp -d)"
          trap 'rm -rf "${STAGE}"' EXIT
          find "${SOURCE_DIR}" -type f \
            \( -name '*.iso' -o -name '*.qcow2' -o -name '*CHECKSUM*' \) \
            -exec cp -v {} "${STAGE}/" \;
          # The release page shows README.md contents to visitors, so ship the
          # download instructions alongside the images.
          cp disk_config/sourceforge-readme.md "${STAGE}/README.md"

          # --delete-after replaces the previous build instead of piling up:
          # the project has a soft disk quota, and every run adds several GB.
          rsync -avP --delete-after \
            --chmod=Du=rwx,Dgo=rx,Fu=rw,Fgo=r \
            -e ssh \
            "${STAGE}/" \
            "${SF_USERNAME}@frs.sourceforge.net:${REMOTE}/"
